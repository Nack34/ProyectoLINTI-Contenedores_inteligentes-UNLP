name: env_contenedor_inteligente
channels:
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - https://repo.anaconda.com/pkgs/msys2
dependencies:
  - bzip2=1.0.8
  - ca-certificates=2025.2.25
  - libffi=3.4.4
  - openssl=3.0.16
  - pip=25.1
  - python=3.11.11
  - setuptools=78.1.1
  - sqlite=3.45.3
  - tk=8.6.14
  - ucrt=10.0.22621.0
  - vc=14.42
  - vc14_runtime=14.42.34433
  - vs2015_runtime=14.42.34433
  - wheel=0.45.1
  - xz=5.6.4
  - zlib=1.2.13
  - pip:
      # Framework y servidor
      - asgiref==3.8.1
      - django==5.2.1
      - sqlparse==0.5.3
      - tzdata==2025.2

      # API (Django Rest Framework)
      - djangorestframework==3.15.2
      - djangorestframework-simplejwt==5.3.1
      - drf-spectacular==0.27.2

      # Utilidades esenciales y dependencias de Ultralytics
      - numpy==1.26.4
      - pillow==11.2.1
      - pyyaml==6.0.2
      - tqdm==4.67.1
      - rich==14.0.0
      - python-dateutil==2.9.0.post0

      # Vision por computadora
      - opencv-python==4.11.0.86

      # Ultralytics (incluye torch y torchvision via env_extra)
      - ultralytics==8.3.153

      # Hardware y QR
      - pyserial==3.5
      - qrcode==7.4.2
